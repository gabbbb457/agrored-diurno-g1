$kind: http-request
url: "{{usuarios_url}}/usuarios/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "produccion@agrored.com",
      "password": "Produccion2026*"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Código 200', () => pm.response.to.have.status(200));
      pm.collectionVariables.set('token_produccion', pm.response.json().token);
    language: text/javascript
order: 5000
