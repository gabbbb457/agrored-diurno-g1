$kind: http-request
url: "{{base_url}}/clientes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Agro Sur",
      "nit": "900777888-1",
      "email": "ferre@central.com",
      "telefono": "3151112233",
      "ciudad": "Palmira"
    }
auth:
  type: bearer
  credentials:
    token: "{{token_comercial}}"
scripts:
  - type: afterResponse
    code: pm.test('Código 201', () => pm.response.to.have.status(201));
    language: text/javascript
order: 6000
