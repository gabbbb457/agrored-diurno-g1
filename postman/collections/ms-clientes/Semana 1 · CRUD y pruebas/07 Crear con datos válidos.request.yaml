$kind: http-request
url: "{{base_url}}/clientes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Ferretería Central",
      "nit": "900555111-2",
      "email": "ferre@central.com",
      "telefono": "3151112233",
      "ciudad": "Palmira"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Código 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('nuevo_id', pm.response.json().id);
    language: text/javascript
order: 7000
