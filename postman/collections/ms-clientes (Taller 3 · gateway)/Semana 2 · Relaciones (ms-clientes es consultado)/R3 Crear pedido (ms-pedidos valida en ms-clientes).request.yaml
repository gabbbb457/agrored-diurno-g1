$kind: http-request
url: "{{base_url}}/pedidos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "cliente_id": 1,
      "producto_id": 2,
      "cantidad": 50,
      "centro_distribucion": "Cali"
    }
scripts:
  - type: afterResponse
    code: pm.test('Código 201', () => pm.response.to.have.status(201));
    language: text/javascript
order: 3000
