cat << 'EOF' | sudo tee /var/www/app/lotes.html > /dev/null
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgroRed · Lotes</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header id="encabezado"></header>
  <main>
    <h1>Lotes</h1>
    <p class="subtitulo">Lotes de producción</p>

    <div class="acciones-superiores">
      <div>
        <label for="filtro">Resultado de calidad</label>
        <select id="filtro">
          <option value="">Todos</option>
          <option value="pendiente">Pendiente</option>
          <option value="aprobado">Aprobado</option>
          <option value="rechazado">Rechazado</option>
        </select>
      </div>
      <div class="derecha">
        <button type="button" id="btn-nuevo" class="boton" hidden>+ Nuevo lote</button>
      </div>
    </div>

    <div id="aviso" class="aviso" role="alert" hidden style="margin-bottom:12px"></div>

    <div class="tarjeta">
      <table>
        <thead>
          <tr>
            <th>Código</th>
            <th>Producto</th>
            <th>Fecha de producción</th>
            <th class="num">Cantidad</th>
            <th>Calidad</th>
            <th class="col-acciones">Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-lotes"></tbody>
      </table>
      <p id="vacio" class="vacio" hidden>No hay lotes para mostrar.</p>
    </div>
  </main>

  <div class="ventana" id="dialogo">
    <form class="tarjeta" id="formulario" novalidate>
      <h2 id="titulo-form">Nuevo lote</h2>
      <div id="errores-form" class="error" role="alert" hidden style="margin-bottom:12px"></div>

      <div class="campo">
        <label for="codigo_lote">Código del lote</label>
        <input id="codigo_lote" name="codigo_lote" required maxlength="30">
      </div>
      <div class="campo">
        <label for="producto_id">Producto</label>
        <select id="producto_id" name="producto_id" required></select>
      </div>
      <div class="campo">
        <label for="fecha_produccion">Fecha de producción</label>
        <input id="fecha_produccion" name="fecha_produccion" type="date" required>
      </div>
      <div class="campo">
        <label for="cantidad">Cantidad</label>
        <input id="cantidad" name="cantidad" type="number" min="1" step="1" required>
      </div>
      <div class="campo">
        <label for="resultado_calidad">Resultado de calidad</label>
        <select id="resultado_calidad" name="resultado_calidad" required>
          <option value="pendiente">Pendiente</option>
          <option value="aprobado">Aprobado</option>
          <option value="rechazado">Rechazado</option>
        </select>
      </div>

      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
        <button type="button" id="btn-cancelar" class="boton secundario" style="color:var(--texto)">Cancelar</button>
        <button type="submit" class="boton">Guardar</button>
      </div>
    </form>
  </div>

  <script src="js/config.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script>pintarEncabezado('lotes.html');</script>
  <script src="js/lotes.js"></script>
</body>
</html>
EOF
