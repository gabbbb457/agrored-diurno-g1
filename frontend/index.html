<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgroRed · Iniciar sesión</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <div class="pantalla-login">
    <form class="tarjeta" id="formulario-login">
      <h1>AgroRed</h1>
      <p class="subtitulo">Inicio de sesión</p>
      <div class="campo">
        <label for="email">Correo</label>
        <input id="email" type="email" value="admin@empresa.com" required>
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <input id="password" type="password" value="Admin2026*" required>
      </div>
      <div class="campo">
        <label for="rol">Entrar como (simulado en el Taller 2)</label>
        <select id="rol">
          <option value="administrador">administrador</option>
          <option value="comercial">comercial</option>
          <option value="produccion">produccion</option>
        </select>
      </div>
      <p class="aviso">Inicio de sesión simulado: se elige el rol. En el Taller 3 se reemplaza por POST /usuarios/login, que devuelve el token y el rol real.</p>
      <button class="boton" type="submit" style="width:100%;margin-top:12px">Entrar</button>
    </form>
  </div>

  <script src="js/config.js"></script>
  <script src="js/sesion.js"></script>
  <script>
    // Si ya hay sesión, ir directo a la página de inicio del rol
    const actual = Sesion.leer();
    if (actual) window.location.href = Sesion.paginaDeInicio(actual.rol);

    document.getElementById('formulario-login').addEventListener('submit', (evento) => {
      evento.preventDefault();
      const rol = document.getElementById('rol').value;
      const nombres = { administrador: 'Administrador General', comercial: 'Comercial Prueba', produccion: 'Produccion Prueba' };
      // Taller 3: aquí va el POST /usuarios/login y se guarda el token que responde
      Sesion.guardar({ nombre: nombres[rol], email: document.getElementById('email').value, rol, token: null });
      window.location.href = Sesion.paginaDeInicio(rol);
    });
  </script>
</body>
</html>
