<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgroRed · Iniciar sesión</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <div class="pantalla-login">
    <form class="tarjeta" id="formulario-login">
      <h1>AgroRed</h1>
      <p class="subtitulo">Inicio de sesión</p>
      <div class="campo">
        <label for="email">Correo</label>
        <input id="email" type="email" autocomplete="username" required>
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <p class="error" id="error-login" role="alert"></p>
      <button class="boton" id="entrar" type="submit" style="width:100%;margin-top:12px">Entrar</button>
    </form>
  </div>

  <script src="js/config.js"></script>
  <script src="js/sesion.js"></script>
  <script>
    // Si ya hay sesión, ir directo a la página de inicio del rol
    const actual = Sesion.leer();
    if (actual && MENU_POR_ROL[actual.rol]) window.location.href = Sesion.paginaDeInicio(actual.rol);

    const formulario = document.getElementById('formulario-login');
    const mensaje = document.getElementById('error-login');
    const boton = document.getElementById('entrar');

    // Inicio de sesión real: POST /api/usuarios/login (ms-usuarios, a través del gateway)
    formulario.addEventListener('submit', async (evento) => {
      evento.preventDefault();
      mensaje.textContent = '';
      boton.disabled = true;
      try {
        const respuesta = await fetch(`${CONFIG.API_URL}/usuarios/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        if (respuesta.status === 400 || respuesta.status === 401) {
          mensaje.textContent = 'Email o contraseña incorrectos';
          return;
        }
        if (!respuesta.ok) {
          mensaje.textContent = `No se pudo iniciar sesión (${respuesta.status}). Inténtalo de nuevo más tarde.`;
          return;
        }
        const { token, usuario } = await respuesta.json();
        if (!MENU_POR_ROL[usuario.rol]) {
          mensaje.textContent = `Tu rol (${usuario.rol}) no tiene pantallas asignadas`;
          return;
        }
        // Se guardan el token y los datos del usuario (nombre y rol) solo en esta pestaña
        Sesion.guardar({ nombre: usuario.nombre, email: usuario.email, rol: usuario.rol, token });
        window.location.href = Sesion.paginaDeInicio(usuario.rol);
      } catch (error) {
        mensaje.textContent = 'No se pudo conectar con el servidor. Inténtalo de nuevo.';
      } finally {
        boton.disabled = false;
      }
    });
  </script>
</body>
</html>
